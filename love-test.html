<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>恋爱占有欲指数测评</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #faf4f6 0%, #fce4ec 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            color: #374151;
        }
        .container { width: 100%; max-width: 42rem; margin-top: 1.5rem; }

        .back-link {
            display: inline-block; margin-bottom: 12px;
            padding: 8px 18px; border: 1px solid #e92063; color: #e92063;
            border-radius: 20px; text-decoration: none; font-size: 0.85em;
            transition: all 0.2s;
        }
        .back-link:hover { background: #e92063; color: #fff; }

        .question-card, .result-card {
            background: white; border-radius: 20px; padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08); width: 100%;
            transition: all 0.3s ease; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }

        .progress-container { margin-bottom: 2.5rem; }
        .progress-bar { height: 10px; background: #f5f5f5; border-radius: 5px; overflow: hidden; margin-top: 12px; }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #e92063, #ff4081);
            width: 0%; transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1); border-radius: 5px;
        }

        .options-list { display: flex; flex-direction: column; gap: 14px; margin-top: 2rem; }
        .option-label {
            display: flex; align-items: center; padding: 18px 20px;
            border: 2px solid #e5e7eb; border-radius: 14px; cursor: pointer;
            transition: all 0.3s; font-size: 1.05rem; background: white;
        }
        .option-label:hover { background: #fff5f7; border-color: #ffb3c6; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(233,32,99,0.1); }
        .option-label.selected { background: #fff5f7; border-color: #e92063; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(233,32,99,0.15); }
        input[type="radio"] { margin-right: 16px; width: 22px; height: 22px; cursor: pointer; }

        .btn-group { display: flex; gap: 14px; margin-top: 2.5rem; }
        button {
            flex: 1; padding: 16px; border-radius: 14px; border: none;
            font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: all 0.3s;
        }
        .btn-prev { background: #f8f9fa; color: #4b5563; border: 2px solid #e5e7eb; }
        .btn-prev:hover:not(:disabled) { background: #f1f3f4; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-next { background: linear-gradient(135deg, #e92063, #ff4081); color: white; }
        .btn-next:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(233,32,99,0.3); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        h1 { color: #e92063; text-align: center; margin-bottom: 0.5rem; font-size: 2rem; font-weight: 800; }
        .q-num { color: #e92063; font-weight: 700; font-size: 1.5rem; margin-right: 10px; }

        .result-card { text-align: center; animation: fadeIn 0.8s ease; }
        .score-circle {
            width: 140px; height: 140px; border-radius: 50%;
            background: linear-gradient(135deg, #fff5f7, #ffe4e9);
            border: 8px solid #e92063;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 2rem; font-size: 2.5rem; font-weight: 800;
            color: #e92063; box-shadow: 0 10px 30px rgba(233,32,99,0.2);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }
        .result-title { font-size: 1.6rem; color: #e92063; margin-bottom: 1.5rem; font-weight: 700; }
        .result-desc {
            line-height: 1.8; color: #4b5563; background: #fdf2f8;
            padding: 2rem; border-radius: 16px; text-align: left; font-size: 1.05rem;
            border-left: 4px solid #e92063;
        }
        .result-footer { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 0.9rem; }

        @media (max-width: 640px) {
            .container { margin-top: 1rem; padding: 0.5rem; }
            .question-card, .result-card { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
            .score-circle { width: 120px; height: 120px; font-size: 2rem; }
            .btn-group { flex-direction: column; }
            .option-label { padding: 15px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <header class="container" style="text-align: center; margin-bottom: 1rem;">
        <a href="index.html" class="back-link">← 返回首页</a>
        <h1>恋爱占有欲指数测评</h1>
        <p style="color: #6b7280; font-size: 1rem;">50道专业题目 · 科学评估</p>
    </header>

    <main class="container">
        <div id="quiz-container" class="question-card">
            <div class="progress-container">
                <div style="display:flex;justify-content:space-between;font-size:0.95rem;font-weight:500;">
                    <span id="progress-text">第 1 / 50 题</span>
                    <span id="percent-text">0%</span>
                </div>
                <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            </div>
            <div id="question-box">
                <h2 id="question-text" style="font-size:1.3rem;min-height:4rem;line-height:1.5;">
                    <span class="q-num">1.</span>加载中...
                </h2>
                <div class="options-list" id="options-box"></div>
            </div>
            <div class="btn-group">
                <button onclick="prevQuestion()" class="btn-prev" id="btn-prev" disabled>上一题</button>
                <button onclick="nextQuestion()" class="btn-next" id="btn-next" disabled>下一题</button>
            </div>
        </div>

        <div id="result-container" class="result-card hidden">
            <div class="score-circle" id="final-score">0</div>
            <h2 class="result-title" id="result-title">计算中...</h2>
            <div class="result-desc" id="result-detail"></div>
            <div class="result-footer">
                <p>本测评结果仅供参考，如需专业帮助请咨询心理专家</p>
                <p style="margin-top:5px;">© 恋爱占有欲指数测评系统</p>
            </div>
            <button onclick="location.reload()" class="btn-next" style="margin-top:2rem;width:100%;">🔄 重新测试</button>
        </div>
    </main>

<script>
const questions = [
    "我会要求伴侣报告每天的详细行程",
    "我会翻看伴侣的手机通话记录或聊天信息",
    "如果伴侣不接电话，我会感到非常焦虑或愤怒",
    "我希望伴侣减少与我不喜欢的异性朋友往来",
    "当伴侣夸奖其他异性时，我会感到强烈的威胁感",
    "我希望我是伴侣生活中的唯一重心",
    "我会通过社交媒体定位或监控伴侣的位置",
    "伴侣去参加聚会时，我希望他/她能随时拍照给我看",
    "我不喜欢伴侣穿太显眼或性感的衣服出门",
    "我会因为伴侣对别人（尤其是异性）的问题更耐心而不快",
    "如果伴侣没有及时回信息，我会反复刷屏或追问",
    "我曾想过在伴侣的手机里安装定位软件",
    "我不希望伴侣保留前任的任何联系方式或物品",
    "当伴侣和同事出去团建时，我会感到不安全",
    "我会试图干涉伴侣选择朋友的标准",
    "如果伴侣和别人聊天笑得很开心，我会莫名生气",
    "我希望伴侣的手机锁屏密码告诉我",
    "我会下意识地打探伴侣周围异性同事的信息",
    "我觉得伴侣不需要太多的个人私密空间",
    "当伴侣提到想一个人静静时，我觉得那是他/她在疏远我",
    "我会通过伴侣的朋友来侧面打听他/她的行踪",
    "如果伴侣去外地出差，我会要求频繁视频通话",
    "我不喜欢伴侣参加有异性在场的单独活动",
    "我经常担心伴侣会被比我更优秀的人吸引",
    "我会要求伴侣删除某些我觉得「有威胁」的好友",
    "我认为伴侣爱我就应该对我毫无保留",
    "如果伴侣夸奖电影里的明星，我会感到不悦",
    "我希望掌握伴侣的所有社交账号密码",
    "伴侣和异性说话时，我会不自觉地盯着他们看",
    "我经常会问伴侣「你到底爱不爱我」",
    "我不喜欢伴侣花太多时间在兴趣爱好上（而不陪我）",
    "如果伴侣不听我的建议，我会觉得他/她在挑战我",
    "我会翻阅伴侣很久以前的社交动态和评论",
    "我觉得恋人之间不应该有任何秘密",
    "我会因为伴侣晚回家10分钟而盘问很久",
    "我希望伴侣把我们的亲密合照发到朋友圈展示",
    "如果伴侣和异性共事，我会提醒他/她保持距离",
    "我会因为伴侣没有分享他/她的日常而感到被冷落",
    "我觉得监控伴侣是为了更好地保护这段感情",
    "如果伴侣想去见老同学，我必须跟着去",
    "我会通过观察伴侣对别人点赞来判断其忠诚度",
    "我希望伴侣在任何社交场合都带上我",
    "当伴侣表现出独立性时，我会感到自己失去了控制",
    "我会因伴侣没秒回信息而脑补他/她在做对不起我的事",
    "我曾偷偷试过登录伴侣的微信或QQ",
    "我不喜欢伴侣和闺蜜/哥们聊我们的私事",
    "如果伴侣对陌生人很客气，我会觉得那是「撩」",
    "我会要求伴侣在非工作时间必须陪我聊天",
    "当伴侣提到某个异性名字次数稍多，我就开始警觉",
    "我觉得占有欲强说明我爱得深"
];

const options = ["从不", "很少", "有时", "经常", "极频繁"];
const optionValues = [0, 1, 2, 3, 4];
let currentIdx = 0;
let answers = new Array(questions.length).fill(null);

function renderQuestion() {
    const q = questions[currentIdx];
    document.getElementById('question-text').innerHTML = `<span class="q-num">${currentIdx+1}.</span>${q}`;
    document.getElementById('progress-text').innerText = `第 ${currentIdx+1} / ${questions.length} 题`;
    const progress = ((currentIdx+1) / questions.length) * 100;
    document.getElementById('progress-fill').style.width = `${progress}%`;
    document.getElementById('percent-text').innerText = `${Math.round(progress)}%`;

    const optionsBox = document.getElementById('options-box');
    optionsBox.innerHTML = '';
    options.forEach((opt, i) => {
        const label = document.createElement('label');
        label.className = `option-label ${answers[currentIdx]===i?'selected':''}`;
        label.innerHTML = `<input type="radio" name="q" value="${i}" ${answers[currentIdx]===i?'checked':''}><span>${opt}</span>`;
        label.onclick = () => selectOption(i);
        optionsBox.appendChild(label);
    });
    document.getElementById('btn-prev').disabled = currentIdx===0;
    document.getElementById('btn-next').innerText = (currentIdx===questions.length-1)?"查看结果":"下一题";
    document.getElementById('btn-next').disabled = answers[currentIdx]===null;
}

function selectOption(val) {
    answers[currentIdx] = val;
    options.forEach((_, i) => {
        const el = document.querySelectorAll('.option-label')[i];
        if(el) { el.classList.toggle('selected', i===val); el.querySelector('input').checked = i===val; }
    });
    document.getElementById('btn-next').disabled = false;
}

function nextQuestion() {
    if (answers[currentIdx]===null) return;
    if (currentIdx < questions.length-1) { currentIdx++; renderQuestion(); }
    else { showResult(); }
}

function prevQuestion() {
    if (currentIdx > 0) { currentIdx--; renderQuestion(); }
}

function showResult() {
    document.getElementById('quiz-container').classList.add('hidden');
    document.getElementById('result-container').classList.remove('hidden');
    const totalRawScore = answers.reduce((sum,a) => sum+(a!==null?optionValues[a]:0), 0);
    const score = Math.round((totalRawScore / (questions.length*4)) * 100);
    const finalScoreEl = document.getElementById('final-score');
    let current=0, increment=score/50;
    const timer = setInterval(() => {
        current+=increment;
        if(current>=score){current=score;clearInterval(timer);}
        finalScoreEl.innerText = Math.round(current);
    }, 20);

    let title="", detail="";
    if(score<=20){
        title="自由型伴侣 🌊";
        detail="你的占有欲极低，在感情中非常大度且信任对方。你认为爱情应当像风一样自由，给予伴侣充足的私人空间和个人时间。你注重精神上的连接而非形式上的控制，这让你在关系中显得成熟而自信。\n\n然而，适度的关注和依赖也是感情的润滑剂。如果对方需要更多的关心，不妨适当调整自己的相处模式。健康的关系需要在自由与亲密之间找到平衡点。";
    }else if(score<=45){
        title="温和型伴侣 🌸";
        detail="你拥有健康的占有欲水平。你会在意伴侣的行为，但懂得适可而止；你会吃醋，但能够理性沟通。这种适度的占有欲反而让关系更加紧密，因为你在表达关心和在乎的同时，也尊重对方的独立性。\n\n你懂得在「亲密」与「独立」之间寻找平衡，能够建立稳定而舒适的情感关系。这是理想的恋爱状态，继续保持这种理性的相处模式。";
    }else if(score<=75){
        title="警觉型伴侣 ⚠️";
        detail="你的占有欲较强，内心深处缺乏足够的安全感。你会不自觉地监控伴侣的言行，对潜在的「威胁」保持高度警觉。这可能源于过往的情感经历或对自我价值的怀疑，让你害怕失去而过度控制。\n\n建议与伴侣进行深度沟通，坦诚自己的不安全感。同时培养自信心，拓展个人社交圈和兴趣爱好，减少对单一关系的过度依赖。适度的控制可以保护关系，但过度则会伤害彼此。";
    }else{
        title="极端型伴侣 🔥";
        detail="你的占有欲指数非常高，已经接近控制型关系模式。你倾向于完全掌控伴侣的生活细节，将对方视为自己的「私有物」。这种极端控制往往源于深层的不安全感和对失控的恐惧，但实际效果往往适得其反——过度的压力会让对方想要逃离。\n\n强烈建议：1. 寻求专业心理咨询；2. 练习情绪管理和自我觉察；3. 重建健康的边界意识；4. 培养独立人格和自我价值感。真正的爱是给予自由而非束缚。";
    }
    setTimeout(()=>{
        document.getElementById('result-title').innerText=`测评结果：${title}`;
        document.getElementById('result-detail').innerHTML = detail.replace(/\n\n/g,'<br><br>');
    },1200);
}

document.addEventListener('keydown', function(e) {
    if (!document.getElementById('quiz-container').classList.contains('hidden')) {
        if(e.key==='ArrowLeft' && currentIdx>0) prevQuestion();
        if((e.key==='ArrowRight'||e.key==='Enter') && answers[currentIdx]!==null) nextQuestion();
        if(['1','2','3','4','5'].includes(e.key)) selectOption(parseInt(e.key)-1);
    }
});

renderQuestion();
</script>
</body>
</html>
