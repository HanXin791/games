<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>开心种菜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .wrapper { text-align: center; padding: 10px; max-width: 100%; }
  h1 { color: #4caf50; font-size: 2em; margin-bottom: 6px; }
  .info { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; flex-wrap: wrap; }
  .info-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 16px;
    color: #eee;
    font-size: 0.9em;
    min-width: 70px;
  }
  .info-box .val { color: #f5c518; font-weight: bold; font-size: 1.3em; display: block; }
  .info-box .lbl { color: #888; font-size: 0.75em; }

  /* 农场网格 */
  .farm {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 380px;
    margin: 0 auto 15px;
    padding: 16px;
    background: rgba(76,175,80,0.08);
    border: 2px solid rgba(76,175,80,0.3);
    border-radius: 14px;
  }
  .plot {
    aspect-ratio: 1;
    background: #3e2723;
    border: 2px solid #5d4037;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .plot:active { transform: scale(0.93); }
  .plot.empty { background: #4e342e; border-color: #6d4c41; }
  .plot.planted { background: #33691e; border-color: #558b2f; }
  .plot.growing { background: #558b2f; border-color: #7cb342; }
  .plot.mature { background: #2e7d32; border-color: #4caf50; box-shadow: 0 0 12px rgba(76,175,80,0.4); }

  .plot .time-bar {
    position: absolute;
    bottom: 0; left: 0; height: 3px;
    background: #f5c518;
    transition: width 0.3s;
  }

  .tip { color: #888; margin-top: 8px; font-size: 0.8em; }
  button {
    margin: 8px 4px; padding: 10px 24px; font-size: 1em;
    background: #4caf50; color: #fff; border: none; border-radius: 6px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover, button:active { background: #388e3c; }
  .back { background: transparent; border: 1px solid #888; color: #888; }
  .back:hover, .back:active { border-color: #eee; color: #eee; background: transparent; }

  .page { display: flex; align-items: flex-start; justify-content: center; gap: 15px; }
  .ad-left, .ad-right { width: 140px; display: flex; flex-direction: column; gap: 12px; margin-top: 60px; }
  .ad-side {
    width: 140px; height: 160px;
    border: 2px dashed #e94560; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #e94560; background: rgba(233,69,96,0.05); text-align: center;
  }
  .ad-side .icon { font-size: 1.5em; margin-bottom: 4px; }
  .ad-side .title { font-size: 0.8em; font-weight: bold; }
  .ad-side .phone { font-size: 0.7em; color: #f5c518; margin-top: 2px; }

  .ad-bottom {
    max-width: 680px; margin: 10px auto 0; height: 45px;
    border: 2px dashed #f5c518; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #f5c518; background: rgba(245,197,24,0.04); padding: 0 10px;
  }
  .ad-bottom .icon { font-size: 1.2em; }
  .ad-bottom .title { font-size: 0.85em; font-weight: bold; }

  @media (max-width: 750px) {
    body { align-items: flex-start; padding-top: 10px; }
    .wrapper { padding: 8px; }
    h1 { font-size: 1.5em; }
    .info { gap: 10px; }
    .info-box { padding: 6px 12px; font-size: 0.8em; }
    .info-box .val { font-size: 1.1em; }
    .farm { grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px; max-width: 340px; }
    .plot { font-size: 1.6em; border-radius: 8px; }
    .tip { font-size: 0.72em; }
    button { padding: 8px 18px; font-size: 0.9em; }

    .page { flex-direction: column; align-items: center; gap: 8px; }
    .ad-left, .ad-right { flex-direction: row; width: auto; margin-top: 0; gap: 8px; }
    .ad-right { order: 3; }
    .ad-side { width: 140px; height: 60px; flex-shrink: 0; }
    .ad-side .icon { font-size: 1em; margin-bottom: 0; }
    .ad-side .title { font-size: 0.7em; }
    .ad-side .phone { font-size: 0.65em; }
    .ad-bottom { max-width: 100%; height: auto; min-height: 38px; font-size: 0.78em; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="page">
    <div class="ad-left">
      <div class="ad-side"><span class="icon">💰</span><span class="title">广告位招租</span><span class="phone">193-3466-7775</span></div>
      <div class="ad-side"><span class="icon">🎯</span><span class="title">广告位招租</span><span class="phone">193-3466-7775</span></div>
    </div>

    <div class="container">
      <h1>🌱 开心种菜</h1>
      <div class="info">
        <div class="info-box"><span class="val" id="gold">100</span><span class="lbl">金币</span></div>
        <div class="info-box"><span class="val" id="seeds">5</span><span class="lbl">种子</span></div>
        <div class="info-box"><span class="val" id="harvestCount">0</span><span class="lbl">收获次数</span></div>
      </div>
      <div class="farm" id="farm"></div>
      <p class="tip">点击空地播种 | 等蔬菜成熟后点击收获 | 成熟菜不收获会枯萎哦</p>
      <button onclick="buySeeds()">买种子 (5金币/个)</button>
      <button class="back" onclick="location.href='games-home.html'">返回首页</button>
    </div>

    <div class="ad-right">
      <div class="ad-side"><span class="icon">🎮</span><span class="title">广告位招租</span><span class="phone">193-3466-7775</span></div>
      <div class="ad-side"><span class="icon">🔥</span><span class="title">广告位招租</span><span class="phone">193-3466-7775</span></div>
    </div>
  </div>

  <div class="ad-bottom"><span class="icon">📣</span><span class="title">广告位招租</span><span style="color:#f5c518;font-size:0.8em;">联系：193-3466-7775</span></div>
</div>

<script>
const ROWS = 3, COLS = 4;
const CROPS = [
  { name: '🥕', emoji: '🥕', seed: '🌰', grow: 6, value: 15 },
  { name: '🌽', emoji: '🌽', seed: '🌰', grow: 8, value: 20 },
  { name: '🍅', emoji: '🍅', seed: '🌰', grow: 10, value: 25 },
  { name: '🥬', emoji: '🥬', seed: '🌰', grow: 5, value: 12 },
  { name: '🍓', emoji: '🍓', seed: '🌰', grow: 12, value: 35 },
  { name: '🫑', emoji: '🫑', seed: '🌰', grow: 7, value: 18 },
];

// 状态: null=空, {crop, startTime, stage: 0|1|2|3, wiltTime}
let plots = Array.from({length: ROWS}, () => Array(COLS).fill(null));
let gold = 100, seeds = 5, harvestCount = 0;

function save() {
  localStorage.setItem('farm_plots', JSON.stringify(plots));
  localStorage.setItem('farm_gold', gold);
  localStorage.setItem('farm_seeds', seeds);
  localStorage.setItem('farm_harvest', harvestCount);
}
function load() {
  try {
    const p = JSON.parse(localStorage.getItem('farm_plots'));
    if (p && p.length === ROWS) {
      // 重新计算时间差
      const now = Date.now();
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) {
          if (!p[r][c]) continue;
          const elapsed = (now - p[r][c].startTime) / 1000;
          const totalTime = p[r][c].crop.grow;
          const stageRatio = elapsed / totalTime;
          if (stageRatio >= 1.5) { p[r][c] = null; } // 枯萎
          else if (stageRatio >= 1) { p[r][c].stage = 3; p[r][c].wiltTime = p[r][c].startTime + totalTime * 1500; }
          else if (stageRatio >= 0.66) { p[r][c].stage = 2; }
          else if (stageRatio >= 0.33) { p[r][c].stage = 1; }
          else { p[r][c].stage = 0; }
        }
    }
    plots = p && p.length === ROWS ? p : Array.from({length: ROWS}, () => Array(COLS).fill(null));
    gold = parseInt(localStorage.getItem('farm_gold')) || 100;
    seeds = parseInt(localStorage.getItem('farm_seeds')) || 5;
    harvestCount = parseInt(localStorage.getItem('farm_harvest')) || 0;
  } catch(e) {
    plots = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    gold = 100; seeds = 5; harvestCount = 0;
  }
}

function updateUI() {
  document.getElementById('gold').textContent = gold;
  document.getElementById('seeds').textContent = seeds;
  document.getElementById('harvestCount').textContent = harvestCount;
}

function getStageInfo(r, c) {
  const p = plots[r][c];
  if (!p) return { stage: -1 };
  const now = Date.now();
  const elapsed = (now - p.startTime) / 1000;
  const totalTime = p.crop.grow;
  const ratio = elapsed / totalTime;

  if (ratio >= 1.5) return { stage: -2 }; // 枯萎了
  if (ratio >= 1) return { stage: 3, ratio, totalTime, startTime: p.startTime, wiltTime: p.startTime + totalTime * 1500 };
  if (ratio >= 0.66) return { stage: 2, ratio, totalTime, startTime: p.startTime };
  if (ratio >= 0.33) return { stage: 1, ratio, totalTime, startTime: p.startTime };
  return { stage: 0, ratio, totalTime, startTime: p.startTime };
}

function render() {
  const farm = document.getElementById('farm');
  farm.innerHTML = '';

  const now = Date.now();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const div = document.createElement('div');
      div.className = 'plot';
      const info = getStageInfo(r, c);

      if (info.stage === -2) {
        // 枯萎
        div.className = 'plot empty';
        div.textContent = '🥀';
        div.style.background = '#3e2723';
        plots[r][c] = null;
      } else if (info.stage === -1) {
        // 空地
        div.className = 'plot empty';
        div.textContent = '🪴';
      } else if (info.stage === 0) {
        div.className = 'plot planted';
        div.textContent = '🌰';
      } else if (info.stage === 1) {
        div.className = 'plot planted';
        div.textContent = '🌱';
      } else if (info.stage === 2) {
        div.className = 'plot growing';
        div.textContent = '🌿';
      } else if (info.stage === 3) {
        div.className = 'plot mature';
        div.textContent = plots[r][c].crop.emoji;
      }

      div.addEventListener('click', () => handleClick(r, c));
      farm.appendChild(div);
    }
  }
  save();
}

function handleClick(r, c) {
  const info = getStageInfo(r, c);

  if (info.stage === -1) {
    // 空地 -> 播种
    if (seeds <= 0) { shakeSeeds(); return; }
    seeds--;
    const crop = CROPS[Math.floor(Math.random() * CROPS.length)];
    plots[r][c] = { crop, startTime: Date.now(), stage: 0 };
    updateUI();
    render();
    return;
  }

  if (info.stage >= 0 && info.stage <= 2) {
    // 还在生长
    return;
  }

  if (info.stage === 3) {
    // 成熟 -> 收获
    const crop = plots[r][c].crop;
    gold += crop.value;
    seeds += 1;
    harvestCount++;
    plots[r][c] = null;
    updateUI();
    render();
    return;
  }

  if (info.stage === -2) {
    // 枯萎 -> 清理
    plots[r][c] = null;
    render();
  }
}

function buySeeds() {
  if (gold < 5) { shakeGold(); return; }
  gold -= 5;
  seeds += 1;
  updateUI();
}

function shakeSeeds() {
  const el = document.getElementById('seeds');
  el.style.color = '#e94560';
  setTimeout(() => el.style.color = '#f5c518', 400);
}

function shakeGold() {
  const el = document.getElementById('gold');
  el.style.color = '#e94560';
  setTimeout(() => el.style.color = '#f5c518', 400);
}

// 定时刷新（检查生长进度和枯萎）
setInterval(() => {
  render();
  updateUI();
}, 1000);

load();
updateUI();
render();
</script>
</body>
</html>
