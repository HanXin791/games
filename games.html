<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小游戏合集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    color: #eee;
  }
  .wrapper { text-align: center; padding: 20px 15px; max-width: 800px; margin: 0 auto; }

  h1 {
    font-size: 2em;
    margin-bottom: 5px;
    background: linear-gradient(90deg, #e94560, #f5c518);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { color: #888; margin-bottom: 20px; font-size: 0.9em; }

  .top-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .top-bar input {
    padding: 6px 12px; border-radius: 6px;
    border: 1px solid #888; background: #1a1a2e; color: #eee;
    font-size: 0.9em; width: 130px; text-align: center;
  }
  .top-bar button {
    padding: 6px 14px; font-size: 0.85em;
    background: #4caf50; color: #fff; border: none; border-radius: 6px; cursor: pointer;
  }
  .top-bar .badge {
    padding: 6px 16px; border-radius: 20px;
    text-decoration: none; font-size: 0.85em; transition: all 0.2s;
  }
  .badge-rank { border: 1px solid #f5c518; color: #f5c518; }
  .badge-rank:hover { background: rgba(245,197,24,0.1); }
  .badge-msg { border: 1px solid #4fc3f7; color: #4fc3f7; }
  .badge-msg:hover { background: rgba(79,195,247,0.1); }
  .badge-home { border: 1px solid #e94560; color: #e94560; }
  .badge-home:hover { background: rgba(233,69,96,0.1); }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .game-card {
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(233,69,96,0.3);
    border-radius: 14px;
    padding: 25px 20px;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    color: #eee;
  }
  .game-card:hover, .game-card:active {
    transform: translateY(-3px);
    border-color: #f5c518;
    background: rgba(245,197,24,0.06);
  }
  .game-card .icon { font-size: 2.8em; margin-bottom: 10px; display: block; }
  .game-card .name { font-size: 1.2em; font-weight: bold; margin-bottom: 5px; }
  .game-card .desc { font-size: 0.8em; color: #888; }

  .service-banner {
    margin: 20px auto 0;
    background: linear-gradient(135deg, rgba(79,195,247,0.08), rgba(233,69,96,0.06));
    border: 1px solid rgba(79,195,247,0.25);
    border-radius: 16px;
    padding: 16px 20px;
    text-align: center;
    max-width: 500px;
  }
  .service-banner .svc-title { font-size: 0.9em; font-weight: bold; color: #4fc3f7; }
  .service-banner .svc-desc { font-size: 0.75em; color: #888; margin: 2px 0; }
  .service-banner .svc-wx {
    display: inline-block; margin-top: 6px;
    padding: 5px 16px; background: rgba(79,195,247,0.12);
    border: 1px solid rgba(79,195,247,0.35); border-radius: 20px;
    color: #4fc3f7; font-size: 0.82em; letter-spacing: 1px;
  }

  .footer { color: #555; font-size: 0.75em; margin-top: 10px; }

  @media (max-width: 500px) {
    h1 { font-size: 1.5em; }
    .games-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .game-card { padding: 18px 12px; }
    .game-card .icon { font-size: 2.2em; }
    .game-card .name { font-size: 1em; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <h1>小游戏合集</h1>
  <p class="subtitle">选择一个游戏开始玩吧</p>

  <div class="top-bar">
    <input id="playerName" placeholder="输入昵称上榜" maxlength="10">
    <button onclick="saveName()">保存</button>
    <a href="leaderboard.html" class="badge badge-rank">排行榜</a>
    <a href="feedback.html" class="badge badge-msg">留言板</a>
    <a href="index.html" class="badge badge-home">返回首页</a>
  </div>

  <div class="games-grid">
    <a href="snake-game.html" class="game-card">
      <span class="icon">🐍</span>
      <div class="name">贪吃蛇</div>
      <div class="desc">经典吃豆长大</div>
    </a>
    <a href="breakout.html" class="game-card">
      <span class="icon">🧱</span>
      <div class="name">打砖块</div>
      <div class="desc">弹球消砖块</div>
    </a>
    <a href="2048.html" class="game-card">
      <span class="icon">🔢</span>
      <div class="name">2048</div>
      <div class="desc">滑动合并数字</div>
    </a>
    <a href="tetris.html" class="game-card">
      <span class="icon">🧩</span>
      <div class="name">俄罗斯方块</div>
      <div class="desc">堆叠消行</div>
    </a>
    <a href="farm.html" class="game-card">
      <span class="icon">🌱</span>
      <div class="name">开心种菜</div>
      <div class="desc">播种收获赚金币</div>
    </a>
    <a href="linkgame.html" class="game-card">
      <span class="icon">🔗</span>
      <div class="name">连连看</div>
      <div class="desc">消除闯关无限关</div>
    </a>
  </div>

  <div class="service-banner">
    <div class="svc-title">帮做小程序 · 帮做网站</div>
    <div class="svc-desc">扫码点单 · 工具箱 · 小游戏 · 个人/企业官网 · 全套AI学习资料包</div>
    <span class="svc-wx">微信：NovemberH_14</span>
  </div>

  <p class="footer">更多游戏即将上线</p>
</div>

<script>
function saveName() {
  const name = document.getElementById('playerName').value.trim();
  if (!name) return;
  localStorage.setItem('player_name', name);
}
document.getElementById('playerName').value = localStorage.getItem('player_name') || '';
</script>
</body>
</html>
