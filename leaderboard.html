<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>排行榜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    color: #eee;
    padding: 15px;
  }
  .wrapper { max-width: 650px; margin: 0 auto; text-align: center; }
  h1 { font-size: 1.8em; margin-bottom: 5px; color: #f5c518; }
  .subtitle { color: #888; font-size: 0.85em; margin-bottom: 15px; }

  .top-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 15px; flex-wrap: wrap;
  }
  .top-bar input {
    padding: 6px 12px; border-radius: 6px;
    border: 1px solid #888; background: #1a1a2e; color: #eee;
    font-size: 0.9em; width: 130px; text-align: center;
  }
  .top-bar button {
    padding: 6px 14px; font-size: 0.85em;
    background: #4caf50; color: #fff; border: none; border-radius: 6px; cursor: pointer;
  }

  .tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; }
  .tab {
    padding: 6px 14px; border: 1px solid #555; border-radius: 20px;
    color: #aaa; cursor: pointer; font-size: 0.85em;
    background: transparent; transition: all 0.2s;
  }
  .tab.active { background: #e94560; border-color: #e94560; color: #fff; }

  .rank-list { text-align: left; }
  .rank-item {
    display: flex; align-items: center;
    padding: 10px 12px; border-radius: 8px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.03);
    gap: 10px;
  }
  .rank-num {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 0.85em; flex-shrink: 0;
  }
  .rank-num.gold { background: #f5c518; color: #1a1a2e; }
  .rank-num.silver { background: #bdbdbd; color: #1a1a2e; }
  .rank-num.bronze { background: #cd7f32; color: #fff; }
  .rank-num.normal { background: rgba(255,255,255,0.1); color: #888; }
  .rank-info { flex: 1; min-width: 0; }
  .rank-name { font-weight: bold; font-size: 0.9em; }
  .rank-date { font-size: 0.7em; color: #666; }
  .rank-score { font-weight: bold; color: #f5c518; font-size: 1em; flex-shrink: 0; }
  .empty-msg { text-align: center; color: #555; padding: 30px; font-size: 0.9em; }

  .nav-links { margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .nav-links a {
    padding: 8px 20px; border: 1px solid #888; color: #888; border-radius: 6px;
    text-decoration: none; font-size: 0.9em;
  }
  .nav-links a:hover { border-color: #eee; color: #eee; }

  @media (max-width: 500px) {
    h1 { font-size: 1.4em; }
    .tabs { gap: 3px; }
    .tab { padding: 5px 10px; font-size: 0.78em; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <h1>排行榜</h1>
  <p class="subtitle" id="totalPlayers"></p>

  <div class="top-bar">
    <input id="playerName" placeholder="输入昵称" maxlength="10">
    <button onclick="saveName()">保存</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('all')">全部总榜</button>
    <button class="tab" onclick="switchTab('snake')">贪吃蛇</button>
    <button class="tab" onclick="switchTab('breakout')">打砖块</button>
    <button class="tab" onclick="switchTab('2048')">2048</button>
    <button class="tab" onclick="switchTab('tetris')">俄罗斯方块</button>
    <button class="tab" onclick="switchTab('farm')">开心种菜</button>
    <button class="tab" onclick="switchTab('link')">连连看</button>
  </div>

  <div class="rank-list" id="rankList">
    <div class="empty-msg">还没有记录，快去玩游戏吧</div>
  </div>

  <div class="nav-links">
    <a href="index.html">返回首页</a>
    <a href="feedback.html">留言板</a>
  </div>
</div>

<script>
const GAMES = {
  all: { name: '全部总榜', icon: '' },
  snake: { name: '贪吃蛇', icon: '' },
  breakout: { name: '打砖块', icon: '' },
  '2048': { name: '2048', icon: '' },
  tetris: { name: '俄罗斯方块', icon: '' },
  farm: { name: '开心种菜', icon: '' },
  link: { name: '连连看', icon: '' },
};
let currentTab = 'all';

function getLeaderboard(game) {
  try { return JSON.parse(localStorage.getItem('lb_' + game) || '[]'); }
  catch(e) { return []; }
}

function getAllScores() {
  const all = [];
  for (const key of Object.keys(GAMES)) {
    if (key === 'all') continue;
    getLeaderboard(key).forEach(e => all.push({ ...e, game: key }));
  }
  all.sort((a, b) => b.score - a.score);
  return all.slice(0, 50);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabs = ['all','snake','breakout','2048','tetris','farm','link'];
  const idx = tabs.indexOf(tab);
  if (idx >= 0) document.querySelectorAll('.tab')[idx].classList.add('active');
  render();
}

function render() {
  let list;
  if (currentTab === 'all') {
    list = getAllScores();
  } else {
    list = getLeaderboard(currentTab);
    list.sort((a, b) => b.score - a.score);
  }
  const container = document.getElementById('rankList');
  if (list.length === 0) {
    container.innerHTML = '<div class="empty-msg">还没有记录，快去玩游戏吧</div>';
    return;
  }
  container.innerHTML = list.map((entry, i) => {
    const numClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
    const gameLabel = currentTab === 'all' ? ` <span style="color:#888;font-size:0.75em;">[${GAMES[entry.game]?.name || entry.game}]</span>` : '';
    const date = entry.date ? new Date(entry.date).toLocaleDateString('zh-CN') : '';
    return `<div class="rank-item">
      <div class="rank-num ${numClass}">${i + 1}</div>
      <div class="rank-info">
        <div class="rank-name">${escapeHtml(entry.name)}${gameLabel}</div>
        <div class="rank-date">${date}</div>
      </div>
      <div class="rank-score">${entry.score} 分</div>
    </div>`;
  }).join('');

  const names = new Set();
  for (const key of Object.keys(GAMES)) {
    if (key === 'all') continue;
    getLeaderboard(key).forEach(e => names.add(e.name));
  }
  document.getElementById('totalPlayers').textContent = names.size > 0 ? `${names.size} 位玩家上榜` : '';
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function saveName() {
  const name = document.getElementById('playerName').value.trim();
  if (!name) return;
  localStorage.setItem('player_name', name);
}
document.getElementById('playerName').value = localStorage.getItem('player_name') || '';

render();
</script>
</body>
</html>
