<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>休闲娱乐合集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrapper { text-align: center; padding: 30px 20px; max-width: 500px; width: 100%; }

  h1 {
    font-size: 2.4em;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #e94560, #f5c518, #4fc3f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { color: #888; font-size: 0.95em; margin-bottom: 50px; }

  .cards { display: flex; flex-direction: column; gap: 24px; }

  .card {
    display: block;
    text-decoration: none;
    color: #eee;
    border-radius: 20px;
    padding: 40px 30px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .card:active { transform: scale(0.96); }

  .card-games {
    background: linear-gradient(135deg, rgba(233,69,96,0.15), rgba(245,197,24,0.1));
    border: 2px solid rgba(233,69,96,0.4);
  }
  .card-games:hover { border-color: #e94560; box-shadow: 0 10px 40px rgba(233,69,96,0.2); transform: translateY(-4px); }

  .card-love {
    background: linear-gradient(135deg, rgba(245,197,24,0.15), rgba(233,69,96,0.1));
    border: 2px solid rgba(245,197,24,0.4);
  }
  .card-love:hover { border-color: #f5c518; box-shadow: 0 10px 40px rgba(245,197,24,0.2); transform: translateY(-4px); }

  .card-icon { font-size: 4em; display: block; margin-bottom: 16px; }
  .card-title { font-size: 1.6em; font-weight: bold; margin-bottom: 6px; }
  .card-desc { font-size: 0.9em; color: #888; }

  .nav-row { display: flex; gap: 12px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
  .nav-link {
    padding: 8px 20px;
    border: 1px solid #555;
    color: #888;
    border-radius: 20px;
    text-decoration: none;
    font-size: 0.85em;
    transition: all 0.2s;
  }
  .nav-link:hover { border-color: #eee; color: #eee; }

  .service-banner {
    margin: 30px auto 0;
    max-width: 500px;
    background: linear-gradient(135deg, rgba(79,195,247,0.08), rgba(233,69,96,0.06));
    border: 1px solid rgba(79,195,247,0.25);
    border-radius: 16px;
    padding: 18px 24px;
    text-align: center;
    transition: all 0.3s;
  }
  .service-banner:hover { border-color: rgba(79,195,247,0.6); box-shadow: 0 4px 20px rgba(79,195,247,0.1); }
  .service-banner .svc-title { font-size: 0.95em; font-weight: bold; color: #4fc3f7; }
  .service-banner .svc-desc { font-size: 0.8em; color: #888; margin: 4px 0; }
  .service-banner .svc-wx {
    display: inline-block; margin-top: 6px;
    padding: 6px 18px; background: rgba(79,195,247,0.12);
    border: 1px solid rgba(79,195,247,0.35); border-radius: 20px;
    color: #4fc3f7; font-size: 0.85em; letter-spacing: 1px;
    text-decoration: none; transition: all 0.2s;
  }
  .service-banner .svc-wx:hover { background: rgba(79,195,247,0.2); }

  @media (max-width: 500px) {
    h1 { font-size: 1.8em; }
    .card { padding: 30px 20px; }
    .card-icon { font-size: 3em; }
    .card-title { font-size: 1.3em; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <h1>休闲娱乐合集</h1>
  <p class="subtitle">选择一个开始吧</p>

  <div class="cards">
    <a href="games.html" class="card card-games">
      <span class="card-icon">🎮</span>
      <div class="card-title">小游戏合集</div>
      <div class="card-desc">贪吃蛇 · 2048 · 俄罗斯方块 · 连连看 等6款游戏</div>
    </a>

    <a href="love-test.html" class="card card-love">
      <span class="card-icon">💕</span>
      <div class="card-title">恋爱占有欲测评</div>
      <div class="card-desc">50道专业题目 · 科学评估 · 即时结果</div>
    </a>
  </div>

  <div class="service-banner">
    <div class="svc-title">帮做小程序 · 帮做网站</div>
    <div class="svc-desc">扫码点单 · 工具箱 · 小游戏 · 个人/企业官网 · 全套AI学习资料包</div>
    <span class="svc-wx">微信：NovemberH_14</span>
  </div>

  <div class="nav-row">
    <a href="leaderboard.html" class="nav-link">排行榜</a>
    <a href="feedback.html" class="nav-link">留言板</a>
  </div>
</div>
</body>
</html>
